name: Windows runtime ZIP
on:
  workflow_dispatch:
    inputs:
      reuse_build_45450573446:
        description: Repackage the successful build job from run 45450573446
        type: boolean
        default: false
permissions:
  contents: read
  actions: read

jobs:
  windows-build:
    runs-on: windows-2022
    env:
      BOOST_ROOT: C:\local\boost_1_87_0
      CMAKE_GENERATOR: Ninja
      CTOOLS_BUILD: all
      CXXFLAGS: "-WX -wd4996 -wd4244 -wd4267 -wd4305"

    steps:
      - name: Checkout AzerothCore
        if: ${{ !inputs.reuse_build_45450573446 }}
        uses: actions/checkout@v4
        with:
          repository: 'mod-playerbots/azerothcore-wotlk'
          persist-credentials: false
          ref: e7e2e288e7d9ec30e2dfe6f417178a95986fcbb2
          path: a

      - name: Checkout Playerbot Module
        if: ${{ !inputs.reuse_build_45450573446 }}
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 796ac3a68489aa5a2c5a75e7cfcfea7f10c6ca57
          path: a/modules/mod-playerbots

      - name: Move source tree to short path
        if: ${{ !inputs.reuse_build_45450573446 }}
        shell: powershell
        run: |
          if (Test-Path C:\ac) {
            Remove-Item C:\ac -Recurse -Force
          }

          New-Item -ItemType Directory -Path C:\ac | Out-Null

          robocopy "${{ github.workspace }}\a" "C:\ac" /MIR /NFL /NDL /NJH /NJS /NP

          if ($LASTEXITCODE -le 7) {
            exit 0
          }

          exit $LASTEXITCODE

      - name: Install Boost and Ninja
        shell: powershell
        run: |
          choco install ninja -y --no-progress
          choco install boost-msvc-14.3 --version=1.87.0 -y --no-progress

      - name: Prepare OpenSSL from runner image
        shell: powershell
        run: |
          $candidates = @(
            "C:\Program Files\OpenSSL",
            "C:\Program Files\OpenSSL-Win64"
          )

          $opensslRoot = $null

          foreach ($candidate in $candidates) {
            if ((Test-Path "$candidate\bin\openssl.exe") -and (Test-Path "$candidate\include\openssl\ssl.h")) {
              $opensslRoot = $candidate
              break
            }
          }

          if (-not $opensslRoot) {
            Write-Host "OpenSSL candidates checked:"
            $candidates | ForEach-Object { Write-Host " - $_" }
            throw "OpenSSL development files not found on runner image"
          }

          if (Test-Path C:\openssl) {
            Remove-Item C:\openssl -Recurse -Force
          }

          New-Item -ItemType Junction -Path C:\openssl -Target $opensslRoot | Out-Null

          "OPENSSL_ROOT_DIR=C:\openssl" >> $env:GITHUB_ENV
          "OPENSSL_DIR=C:\openssl" >> $env:GITHUB_ENV
          "PATH=C:\openssl\bin;$env:PATH" >> $env:GITHUB_ENV

          C:\openssl\bin\openssl.exe version

      - name: ccache
        if: ${{ !inputs.reuse_build_45450573446 }}
        uses: hendrikmuhs/ccache-action@v1.2.13

      - name: Create AzerothCore CI config
        if: ${{ !inputs.reuse_build_45450573446 }}
        shell: bash
        working-directory: C:\ac
        run: |
          mkdir -p conf

          cat > conf/config.sh <<'EOF'
          CCOMPILERC="cl"
          CCOMPILERCXX="cl"

          CTYPE="Release"
          CSCRIPTS="static"
          CMODULES="static"
          CTOOLS_BUILD="all"

          CCUSTOMOPTIONS="-DBOOST_ROOT=C:/local/boost_1_87_0 -DOPENSSL_ROOT_DIR=C:/openssl -DOPENSSL_USE_STATIC_LIBS=FALSE -DCMAKE_RC_COMPILER=rc -DCMAKE_NINJA_FORCE_RESPONSE_FILE=ON -DCMAKE_NINJA_CMCLDEPS_RC=OFF -DCMAKE_C_USE_RESPONSE_FILE_FOR_OBJECTS=ON -DCMAKE_CXX_USE_RESPONSE_FILE_FOR_OBJECTS=ON -DCMAKE_C_USE_RESPONSE_FILE_FOR_INCLUDES=ON -DCMAKE_CXX_USE_RESPONSE_FILE_FOR_INCLUDES=ON -DCMAKE_C_USE_RESPONSE_FILE_FOR_LIBRARIES=ON -DCMAKE_CXX_USE_RESPONSE_FILE_FOR_LIBRARIES=ON"
          EOF

          cat conf/config.sh

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64

      - name: Build
        if: ${{ !inputs.reuse_build_45450573446 }}
        shell: bash
        working-directory: C:\ac
        run: |
          export CTOOLS_BUILD=all
          export CMAKE_GENERATOR=Ninja

          export CC=cl
          export CXX=cl
          export RC=rc

          cmake --version
          ninja --version

          echo "CMAKE_GENERATOR=$CMAKE_GENERATOR"
          echo "CC=$CC"
          echo "CXX=$CXX"
          echo "BOOST_ROOT=$BOOST_ROOT"
          echo "OPENSSL_ROOT_DIR=$OPENSSL_ROOT_DIR"

          which cl || true
          which rc || true
          which openssl || true

          cl || true
          rc || true
          openssl version || true

          rm -rf var/build/obj

          ./acore.sh compiler build

      - name: Package runtime
        if: ${{ !inputs.reuse_build_45450573446 }}
        shell: pwsh
        run: |
          $root = New-Item -Type Directory runtime
          foreach ($name in 'authserver','worldserver') {
            $exe = Get-ChildItem C:\ac\var -Filter "$name.exe" -Recurse | Select-Object -First 1
            if (!$exe) { throw "Missing $name" }
            Copy-Item $exe.FullName $root
            Get-ChildItem $exe.DirectoryName -Filter '*.dll' | Copy-Item -Destination $root
          }
          Get-ChildItem C:\openssl\bin -Filter 'lib*.dll' | Copy-Item -Destination $root
          foreach ($name in 'authserver','worldserver') {
            $config = Get-ChildItem C:\ac -Filter "$name.conf.dist" -Recurse | Select-Object -First 1
            Copy-Item $config.FullName $root
          }
          New-Item -Type Directory runtime/modules | Out-Null
          Copy-Item C:\ac\modules\mod-playerbots\conf\playerbots.conf.dist runtime/modules
          foreach ($dir in 'base','create','updates','custom') {
            Get-ChildItem "C:\ac\data\sql\$dir" -Recurse -Filter '*.sql' | ForEach-Object {
              $dest = Join-Path $root ([IO.Path]::GetRelativePath('C:\ac',$_.FullName))
              New-Item -Force -Type Directory (Split-Path $dest) | Out-Null
              Copy-Item $_.FullName $dest
            }
          }
          Get-ChildItem C:\ac\modules\mod-playerbots\data\sql -Recurse -Filter '*.sql' | ForEach-Object {
            $dest = Join-Path $root ([IO.Path]::GetRelativePath('C:\ac',$_.FullName))
            New-Item -Force -Type Directory (Split-Path $dest) | Out-Null
            Copy-Item $_.FullName $dest
          }
          @("core=$(git -C C:\ac rev-parse HEAD)", "module=$(git -C C:\ac\modules\mod-playerbots rev-parse HEAD)", "workflow=$env:GITHUB_SHA") | Set-Content runtime/revisions.txt

      - uses: actions/download-artifact@v4
        if: inputs.reuse_build_45450573446
        with:
          name: windows-runtime
          path: previous
          run-id: 45450573446
          github-token: ${{ github.token }}

      - name: Verify and unpack previously compiled runtime
        if: inputs.reuse_build_45450573446
        shell: pwsh
        run: |
          Expand-Archive previous/windows-runtime.zip runtime
          Push-Location runtime
          foreach ($line in Get-Content SHA256SUMS) {
            $hash,$file = $line -split '  ',2
            if ((Get-FileHash -LiteralPath $file).Hash -ne $hash) { throw "Checksum mismatch for $file" }
          }
          $revisions = Get-Content revisions.txt
          foreach ($pin in 'module=796ac3a68489aa5a2c5a75e7cfcfea7f10c6ca57','core=e7e2e288e7d9ec30e2dfe6f417178a95986fcbb2') {
            if ($pin -notin $revisions) { throw "Missing revision $pin" }
          }
          Remove-Item SHA256SUMS
          Pop-Location

      - name: Resolve runtime imports and write ZIP
        shell: pwsh
        run: |
          $dirs = @('C:\openssl\bin', "$env:BOOST_ROOT\lib64-msvc-14.3")
          $dirs += Get-ChildItem "$env:ProgramFiles\MySQL\MySQL Server*\bin","$env:ProgramFiles\MySQL\MySQL Server*\lib" -Directory | Select-Object -ExpandProperty FullName
          $dirs += Get-ChildItem "$env:VCToolsRedistDir\x64\Microsoft.VC*.CRT" -Directory | Select-Object -ExpandProperty FullName
          $queue = [Collections.Generic.Queue[string]]::new()
          Get-ChildItem runtime/* -Include *.exe,*.dll -File | ForEach-Object { $queue.Enqueue($_.FullName) }
          $seen = @{}
          while ($queue.Count) {
            $binary = $queue.Dequeue()
            if ($seen.ContainsKey($binary)) { continue }
            $seen[$binary] = $true
            $imports = & dumpbin /nologo /dependents $binary
            if ($LASTEXITCODE) { throw "dumpbin failed for $binary" }
            foreach ($line in $imports) {
              if ($line -notmatch '^\s*([\w.+-]+\.dll)\s*$') { continue }
              $dll = $Matches[1]
              if ($dll -match '^(api|ext)-ms-') { continue }
              if (Test-Path "runtime/$dll") { continue }
              $source = $dirs | ForEach-Object { Join-Path $_ $dll } | Where-Object { Test-Path $_ -PathType Leaf } | Select-Object -First 1
              if (!$source) {
                if (Test-Path "$env:SystemRoot/System32/$dll") { continue }
                throw "Unresolved import $dll in $binary"
              }
              Write-Host "$binary imports $source"
              Copy-Item $source runtime
              $queue.Enqueue((Resolve-Path "runtime/$dll").Path)
            }
          }
          "packaging=$env:GITHUB_SHA" | Add-Content runtime/revisions.txt
          Push-Location runtime
          $lines = Get-ChildItem -Recurse -File | Sort-Object FullName | ForEach-Object {
            "$( (Get-FileHash $_.FullName).Hash )  $([IO.Path]::GetRelativePath($pwd.Path,$_.FullName))"
          }
          $lines | Set-Content SHA256SUMS
          Pop-Location
          Compress-Archive -Path runtime/* -DestinationPath windows-runtime.zip -CompressionLevel Optimal

      - uses: actions/upload-artifact@v4
        with:
          name: windows-runtime
          path: windows-runtime.zip
          compression-level: 0

  smoke:
    needs: windows-build
    runs-on: windows-2022
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-runtime
      - shell: pwsh
        run: |
          Expand-Archive windows-runtime.zip runtime
          Set-Location runtime
          foreach ($line in Get-Content SHA256SUMS) {
            $hash,$file = $line -split '  ',2
            if ((Get-FileHash -LiteralPath $file).Hash -ne $hash) { throw "Checksum mismatch for $file" }
          }
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          foreach ($name in 'authserver','worldserver') {
            & ".\$name.exe" --version
            if ($LASTEXITCODE -ne 0) { throw "$name exited with $LASTEXITCODE" }
          }
